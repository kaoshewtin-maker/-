<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e5ede5"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>日日有餘</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#26372d;font:16px system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:20px 16px 110px}h1{font-size:28px;margin:0}h2{font-size:18px;margin:20px 0 10px}small,label{color:#68766c;display:block;font-size:13px}button,input,select{font:inherit;border:1px solid #d6ded6;border-radius:12px;padding:12px;background:white;color:inherit}button{cursor:pointer}button.active,button.primary{background:#486c54;color:white;border-color:#486c54}.primary{width:100%;margin-top:10px}input,select{width:100%;margin:5px 0 12px}label{margin-top:8px}.hero,.card{padding:16px;border-radius:18px;margin:12px 0;background:white;border:1px solid #e0e5df}.hero{background:#e5ede5}.big{font-size:32px;font-weight:750;letter-spacing:-1px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.cols{display:flex;gap:8px}.cols>*{flex:1;min-width:0}.num{font-size:20px;font-weight:700}hr{border:0;border-top:1px solid #e0e5df;margin:14px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}nav button{flex:1;max-width:180px}.line{padding:12px 0;border-bottom:1px solid #e0e5df}.muted{color:#68766c}progress{width:100%;accent-color:#64876c}summary{cursor:pointer} .danger{color:#b34343} .right{text-align:right}.mini{padding:8px;font-size:13px}a{color:#486c54}</style><main><div class="row"><div><h1>日日有餘</h1><small>DAILY BALANCE · V6.1</small></div><button class="mini" onclick="go('資料')">資料管理</button></div><div id="app"></div></main><nav id="nav"></nav><script>
const funds=[['日文學費',2300],['保險準備金',2000],['人情基金',3000],['旅遊基金',5000],['緊急預備金',8000]], cats=['食','衣','住','行','娛樂'], pays=['台新','國泰','現金'], fixed=[['YouTube',486],['ChatGPT',700],['Disney+',300],['網路費',500],['健身房',1080],['預留差額',34]];const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let month=today().slice(0,7)<'2027-01'?'2027-01':today().slice(0,7),tab='首頁',detail='',records=[];try{records=JSON.parse(localStorage.getItem('dailybalance-v61')||'[]')}catch(e){alert('無法讀取資料，請從備份還原')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+n.toLocaleString('zh-TW'),sum=a=>a.reduce((s,r)=>s+r.amount,0),save=()=>{try{localStorage.setItem('dailybalance-v61',JSON.stringify(records));return true}catch(e){alert('儲存失敗，請立即匯出備份');return false}},go=t=>{tab=t;detail='';render()},change=n=>{let d=new Date(month+'-01T12:00:00');d.setMonth(d.getMonth()+n);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()},end=()=>month<today().slice(0,7)?month+'-31':month===today().slice(0,7)?today():today(),auto=(name,v)=>{let a=[];for(let y=2027,m=1;y<2100;){let date=`${y}-${String(m).padStart(2,'0')}-05`;if(date>end())break;a.push({date,type:'基金',fund:name,kind:'存入',amount:v,note:'每月固定存入（預定）',auto:true});if(++m===13){m=1;y++}}return a},fundRows=(n,v)=>[...auto(n,v),...records.filter(r=>r.type==='基金'&&r.fund===n&&r.date.slice(0,7)<=month)],stats=(n,v)=>{let a=fundRows(n,v),i=sum(a.filter(r=>r.kind==='存入')),o=sum(a.filter(r=>r.kind==='支出'));return [i,o,i-o]},opts=a=>a.map(x=>`<option>${esc(x)}</option>`).join(''),dateDefault=()=>today().slice(0,7)===month?today():month+'-05';function form(f){return `<form onsubmit="add(event)"><label>日期</label><input name="date" type="date" required value="${dateDefault()}"><label>金額</label><input name="amount" type="number" inputmode="numeric" min="1" step="1" required placeholder="NT$ 0">${f?`<label>異動類型</label><select name="kind">${opts(['支出','存入'])}</select>`:`<label>消費分類</label><select name="cat">${opts(cats)}</select><label>付款方式</label><select name="pay">${opts(['國泰','台新','現金'])}</select>`}<label>備註（選填）</label><input name="note" placeholder="可以不填"><button class="primary">${f?'確認異動':'＋ 新增消費'}</button></form>`}function add(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),r={...f,amount:Number(f.amount),type:detail?'基金':'生活費',fund:detail,id:Date.now()+'-'+Math.random()};records.push(r);save();month=r.date.slice(0,7);render()}function del(id){if(confirm('確定刪除這筆紀錄？')){records=records.filter(r=>r.id!==id);save();render()}}function lines(a,remove=true){return a.length?[...a].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="row line"><div><b>${esc(r.cat||r.note||r.kind)}</b><small>${esc(r.date)} · ${esc(r.pay||r.kind)} ${r.cat?esc(r.note):''}</small></div><b>${r.kind==='存入'?'+':'−'}${money(r.amount)}</b>${remove&&!r.auto?`<button class="mini" onclick="del('${esc(r.id)}')">刪除</button>`:''}</div>`).join(''):'<small>目前沒有紀錄</small>'}function render(){let a=records.filter(r=>r.type==='生活費'&&r.date.slice(0,7)===month),s=sum(a),c=sum(a.filter(r=>r.pay==='國泰'));let h=`<div class="row" style="margin-top:18px"><button onclick="change(-1)">‹</button><b>${month.replace('-',' 年 ')} 月</b><button onclick="change(1)">›</button></div>`;if(tab==='首頁'){h+=`<div class="hero"><div class="big ${s>15000?'danger':''}">${money(15000-s)}</div><small>本月剩餘生活費</small><progress max="15000" value="${Math.min(s,15000)}"></progress><div class="row"><small>已花費 ${money(s)}</small><small>預算 $15,000</small></div></div><div class="cols">${pays.map(p=>`<div class="card"><b>${money(sum(a.filter(r=>r.pay===p)))}</b><small>${p}消費</small></div>`).join('')}</div><h2>新增記帳</h2>${form(false)}<h2>本月分類統計</h2><div class="card">${cats.map(p=>`<div class="row line"><span>${p}</span><b>${money(sum(a.filter(r=>r.cat===p)))}</b></div>`).join('')}</div><h2>本月消費紀錄</h2>${lines(a)}`}else if(tab==='台新'){if(detail){let v=funds.find(f=>f[0]===detail)[1], [i,o,b]=stats(detail,v);h+=`<button onclick="detail='';render()">‹ 返回所有小查罐</button><div class="hero"><b>${detail}</b><div class="big">${money(b)}</div><small>剩餘金額</small><hr><div class="cols"><div><b>${money(i)}</b><small>累計存入</small></div><div><b>${money(o)}</b><small>累計支出</small></div></div></div><h2>新增異動</h2>${form(true)}<h2>存款與支出明細</h2>${lines(fundRows(detail,v))}`}else{h+=`<div class="hero"><div class="big">${money(funds.reduce((s,[n,v])=>s+stats(n,v)[2],0))}</div><small>小查罐剩餘總額</small><hr><b>$20,300</b><small>每月 5 日固定存入</small></div><h2>我的小查罐</h2>${funds.map(([n,v])=>{let [i,o,b]=stats(n,v);return `<div class="card" role="button" tabindex="0" onclick="detail='${n}';render()"><div class="row"><div><b>${n}</b><small>每月存入 ${money(v)}</small></div><div class="right"><div class="num">${money(b)}</div><small>剩餘金額</small></div></div><hr><div class="row"><div><b>${money(i)}</b><small>累計存入</small></div><div><b>${money(o)}</b><small>累計支出</small></div><span>›</span></div></div>`}).join('')}`}}else if(tab==='國泰'){h+=`<div class="hero"><div class="big">${money(3100+c)}</div><small>本月預計信用卡支出</small><hr><div class="cols"><div><b>$3,100</b><small>固定支出</small></div><div><b>${money(c)}</b><small>額外刷卡</small></div></div></div><details class="card"><summary>每月固定支出　$3,100</summary>${fixed.map(([n,v])=>`<div class="row line">${n}<b>${money(v)}</b></div>`).join('')}<small>預算金額，非實際扣款日期</small></details><h2>額外刷卡紀錄</h2>${lines(a.filter(r=>r.pay==='國泰'),false)}`}else{h=`<h2>資料管理</h2><div class="card"><p>CSV 包含所有手動紀錄及截至今日的預定基金存入。固定信用卡預算不視為實際交易。</p><button class="primary" onclick="csv()">匯出 CSV</button><button class="primary" onclick="download('日日有餘備份.json',JSON.stringify({version:1,records},null,2),'application/json')">完整 JSON 備份</button><hr><label>匯入 JSON（取代目前紀錄）</label><input type="file" accept=".json,application/json" onchange="restore(this)"><small>資料只存在此瀏覽器，請定期備份。</small></div>`}document.getElementById('app').innerHTML=h;document.getElementById('nav').innerHTML=['首頁','台新','國泰'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')}
function download(n,s,t){let u=URL.createObjectURL(new Blob([s],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function csv(){let old=month;month=today().slice(0,7);let rows=[...records,...funds.flatMap(([n,v])=>auto(n,v))];month=old;let q=x=>'"'+String(x??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';download('日日有餘收支.csv','\ufeff'+[['日期','類型','分類','付款方式','基金','異動','金額','備註','預定存款'],...rows.sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date,r.type,r.cat,r.pay,r.fund,r.kind,r.amount,r.note,r.auto?'是':'否'])].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function restore(el){try{let o=JSON.parse(await el.files[0].text());if(o.version!==1||!Array.isArray(o.records)||!o.records.every(r=>typeof r.id==='string'&&/^[\w.-]+$/.test(r.id)&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isSafeInteger(r.amount)&&r.amount>0&&(r.type==='生活費'&&cats.includes(r.cat)&&pays.includes(r.pay)||r.type==='基金'&&funds.some(f=>f[0]===r.fund)&&['存入','支出'].includes(r.kind))))throw Error();if(confirm('將取代目前全部紀錄，確定已備份？')){records=o.records;save();render()}}catch(e){alert('備份格式不正確')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
